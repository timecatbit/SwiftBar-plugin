name: OpenCodex plugin checks

on:
  push:
    paths: ['opencodex.30s.sh', 'panel/**', 'scripts/**', 'tests/**', 'assets/**', 'config.example.sh', '.github/workflows/opencodex.yml']
  pull_request:
    paths: ['opencodex.30s.sh', 'panel/**', 'scripts/**', 'tests/**', 'assets/**', 'config.example.sh', '.github/workflows/opencodex.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax and regression tests
        run: python3 scripts/check.py
      - name: Compile and verify native helper
        run: python3 scripts/build.py
